name: Release

# Publishing is intentionally kept separate from the Build workflow: Build produces artifacts on
# every push/PR (versioned <last release>.<commits since>, e.g. 4.3), while this workflow is run
# manually, picks the next release number automatically (v1, v2, v3, ...), builds everything with
# that version embedded, and publishes it.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

# never run two releases at once, they would race for the same version number
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  next-version:
    name: Pick next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags are needed to find the latest release number

      - name: Compute next release number
        id: next
        run: |
          # only plain "v<number>" tags count as releases (v1, v2, ...); dev-build and others are ignored
          LAST=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1 || true)
          NEXT=$(( ${LAST:-0} + 1 ))
          echo "Next release: v${NEXT}"
          echo "version=${NEXT}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    needs:
      - next-version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.next-version.outputs.version }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - next-version
      - build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up variables
        id: vars
        run: echo "date_now=$(date --rfc-3339=seconds)" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          artifacts: artifacts/*/*
          body: |
            **DropStream, a fork of [Twitch Drops Miner by DevilXD](https://github.com/DevilXD/TwitchDropsMiner).**

            Windows, macOS (Apple Silicon), and Linux (x86_64 + ARM64) builds are attached below.

            - Published: `${{steps.vars.outputs.date_now}}`
            - Reference commit: ${{github.sha}}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          makeLatest: true
          name: DropStream v${{ needs.next-version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          tag: v${{ needs.next-version.outputs.version }}
