name: Build

on:
  push:
  pull_request:
  # called by release.yml, which passes the release version (e.g. 4)
  workflow_call:
    inputs:
      version:
        description: "Version to embed in the build (e.g. 4). Leave empty to compute it automatically."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed in the build (e.g. 4 or 4.2). Leave empty to compute it automatically."
        required: false
        type: string

env:
  PYTHON_VERSION: "3.10"
  USE_UPX: false

jobs:
  # Computes the version every other job embeds into version.py:
  #  - release build (called from release.yml, or a manual run with a version): used as given, e.g. "4"
  #  - any other push / PR: "<last published release>.<commits since it>", e.g. "4.3"
  #    (or "0.<commit count>" while no release has been published yet)
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and all tags, needed to count commits since the last release

      - name: Compute version
        id: calc
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LAST=$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1 || true)
            if [ -n "${LAST}" ]; then
              COUNT=$(git rev-list --count "v${LAST}..HEAD")
              BASE="${LAST}"
            else
              COUNT=$(git rev-list --count HEAD)
              BASE="0"
            fi
            if [ "${COUNT}" -gt 0 ]; then
              VERSION="${BASE}.${COUNT}"
            else
              VERSION="${BASE}"
            fi
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs:
      - version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - version
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      # TODO: Consider using https://github.com/crazy-max/ghaction-upx
      # or some other way of keeping the download link up to date in the future
      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile (Join-Path $env:Temp upx.zip)
          Expand-Archive -LiteralPath (Join-Path $env:Temp upx.zip) -DestinationPath $env:Temp
          Move-Item -Path (Join-Path $env:Temp upx-*) -Destination (Join-Path $env:Temp upx)
          Add-Content $env:GITHUB_PATH (Join-Path $env:Temp upx)

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec

      - name: Create release folder
        run: |
          $FolderName = 'DropStream'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Compress-Archive -Path $FolderName -DestinationPath DropStream.Windows.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: |
          $Version = (Get-Content version.py) -Replace '^__version__\s*=\s*"([^"]+)".*', '$1'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$Version" installer\dropstream.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.Windows
          path: DropStream.Windows.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.Windows.Installer
          path: installer\Output\DropStream-Setup.exe

  windows-arm64:
    name: Windows (ARM64)
    runs-on: windows-11-arm
    needs:
      - version
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # windows-11-arm only ships native (arm64) Python builds from 3.11 onward;
          # env.PYTHON_VERSION (3.10) has no arm64 Windows build and fails to install here
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec

      - name: Create release folder
        run: |
          $FolderName = 'DropStream'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Compress-Archive -Path $FolderName -DestinationPath DropStream.Windows-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.Windows-arm64
          path: DropStream.Windows-arm64.zip

  macos:
    name: macOS (ARM64)
    # macos-latest currently maps to an Apple Silicon (arm64) runner, so this build is native ARM64.
    runs-on: macos-latest
    needs:
      - version
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create release folder and Zip
        run: |
          FOLDER="DropStream"
          mkdir -p "$FOLDER"
          cp -r "dist/DropStream.app" "$FOLDER/"
          cp manual.txt "$FOLDER/"
          zip -r DropStream.MacOS.zip "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.MacOS
          path: DropStream.MacOS.zip

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - version
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 python3-tk

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      # NOTE: Remove this step if/once libxft gets updated to 2.3.5 or newer on Ubuntu 22.04, which currently has 2.3.4.
      - name: Build a recent version of libXft
        run: |
          mkdir -p /tmp/libXft
          cd /tmp/libXft
          curl -fL https://xorg.freedesktop.org/releases/individual/lib/libXft-2.3.9.tar.xz -o libXft.tar.xz
          sha256sum libXft.tar.xz
          tar xvf libXft.tar.xz
          cd libXft-*
          ./configure --prefix=/tmp/libXft --sysconfdir=/etc --disable-static
          make
          make install-strip

      - name: Create portable executable
        run: |
          LD_LIBRARY_PATH=/tmp/libXft/lib xvfb-run --auto-servernum pyinstaller build.spec

      - name: Show PyInstaller warnings
        run: |
          cat build/build/warn-build.txt || true

      - name: Create release folder
        run: |
          folder='DropStream'
          mkdir "${folder}"
          cp manual.txt dist/* "${folder}"
          7z a 'DropStream.Linux.PyInstaller-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.Linux.PyInstaller-${{matrix.arch}}
          path: DropStream.Linux.PyInstaller-${{matrix.arch}}.zip

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - version
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: echo "__version__ = \"${APP_VERSION}\"" > version.py

      - name: Set up variables
        id: vars
        run: |
          echo "app_version=$(python3 -c 'from version import __version__ as v; print(v)')" >> "${GITHUB_OUTPUT}"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1

      - name: Install appimage-builder
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install wheel
          python3 -m pip install setuptools setuptools_scm
          # TODO: Switch to a stable release if/when a version newer than 1.1.0 is released.
          python3 -m pip install git+https://github.com/AppImageCrafters/appimage-builder.git@1a8794d3c89f288fbd82b9accd7c0b74611147d5

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: |
          appimage-builder --recipe appimage/AppImageBuilder.yml

      - name: Create release folder
        run: |
          folder='DropStream'
          mkdir "${folder}"
          cp *.AppImage manual.txt "${folder}"
          7z a 'DropStream.Linux.AppImage-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: DropStream.Linux.AppImage-${{matrix.arch}}
          path: DropStream.Linux.AppImage-${{matrix.arch}}.zip

